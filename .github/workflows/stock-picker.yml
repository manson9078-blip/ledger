name: Daily stock picker

on:
  schedule:
    - cron: "7 0 * * 1-5"   # 08:07 台灣時間，週一到週五
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stock-picker
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock/requirements.txt
      - run: pip install -r stock/requirements.txt
      - name: Run picker
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python stock/picker.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the PC's scheduled run may have pushed fresher (full) data meanwhile; it wins
          git fetch -q origin "${GITHUB_REF_NAME}"
          if ! git diff --quiet HEAD "origin/${GITHUB_REF_NAME}" -- stock/data; then
            echo "Newer stock data was pushed during this run; skipping commit."
            exit 0
          fi
          git add stock/data
          git diff --cached --quiet && exit 0
          git commit -m "Stock picks $(TZ=Asia/Taipei date +%F) (cloud)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
